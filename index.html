<title>Moved to pterionprep.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://pterionprep.com/">
<script>
  // Old GitHub Pages address -> pterionprep.com, keeping the page path, query and hash.
  (function () {
    var prefix = '/neurosurgery-case-prep-guide';
    var p = location.pathname;
    if (p.indexOf(prefix) === 0) p = p.slice(prefix.length);
    if (!p) p = '/';
    location.replace('https://pterionprep.com' + p + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://pterionprep.com/"></noscript>
</head>
